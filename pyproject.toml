[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littleboy"
version = "0.1.0"
description = "A rational ethical evaluation engine whose foundational axiom is that the fundamental ethical evil is coercion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LittleBoy contributors" }]
keywords = ["ethics", "reasoning", "coercion", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
cli = ["typer>=0.12"]
dev = [
    "pytest>=8.0",
    "typer>=0.12",
    "ruff>=0.5",
]

[project.scripts]
littleboy = "littleboy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() in defaults is the intended Typer idiom.
"src/littleboy/cli.py" = ["B008"]
